<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-label="Duguláselhárítás logó">
    <title>Duguláselhárítás logó</title>

    <!-- Kör alakú alap -->
    <circle cx="60" cy="60" r="57" fill="#0d0d0d"/>
    <circle cx="60" cy="60" r="54" fill="none" stroke="#f2780c" stroke-width="3"/>

    <!-- Víz hullámok -->
    <path d="M 12 78 q 12 -9 24 0 t 24 0 t 24 0 t 24 0" fill="none"
          stroke="#4aa8e0" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <path d="M 12 90 q 12 -9 24 0 t 24 0 t 24 0 t 24 0" fill="none"
          stroke="#4aa8e0" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Duguláselhárító spirál (ciklon) -->
    <g transform="translate(60 50)" fill="none" stroke="#f2780c"
       stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 0 -34 A 34 34 0 1 1 -24 24"/>
        <path d="M 0 -22 A 22 22 0 1 1 -15.6 15.6"/>
        <path d="M 0 -11 A 11 11 0 1 1 -7.8 7.8"/>
    </g>

    <!-- Rácsozott lefolyó-fedél a spirál közepén -->
    <circle cx="60" cy="50" r="9" fill="#0d0d0d" stroke="#f2780c" stroke-width="2.4"/>
    <g stroke="#f2780c" stroke-width="1.8" stroke-linecap="round">
        <line x1="52.5" y1="50" x2="67.5" y2="50"/>
        <line x1="53.6" y1="45.5" x2="66.4" y2="45.5"/>
        <line x1="53.6" y1="54.5" x2="66.4" y2="54.5"/>
        <line x1="60" y1="41" x2="60" y2="59"/>
    </g>
</svg>
